name: Feature request
description: Propose a useful PocketAuthor capability or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What author or publishing problem should this solve?
      description: Start with the user problem rather than the implementation.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Aspiring author
        - Published author
        - Founder / expert / consultant
        - Creator
        - Researcher / educator
        - Memoir / legacy author
        - Ghostwriter
        - Editor
        - Publisher / press
        - Literary agent / rights professional
        - Bookstore / literary organization
        - Developer / contributor
        - Other
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: What should the person be able to do from start to finish?
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: What would success look like?
  - type: textarea
    id: references
    attributes:
      label: References or examples
      description: Add relevant standards, products, research, or existing PocketAuthor routes.
  - type: checkboxes
    id: considerations
    attributes:
      label: Considerations
      options:
        - label: This may affect provenance, attribution, copyright, or permissions.
        - label: This may affect accessibility.
        - label: This may involve third-party APIs or provider claims.
        - label: This may involve AI-assisted behavior requiring human review.
